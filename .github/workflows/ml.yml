# =============================================================================
#  Module    : Cloud of Things – FloodWatch (Sup'Com 2026-2027)
#  Couche    : apprentissage automatique – intégration continue
#  Fichier   : .github/workflows/ml.yml
#  Équipe    : FloodWatch – Auteur : Guesmi Baderddine
#  Créé le   : 2026-11-17          Modifié le : 2026-11-23          Version : 1.1
#  Rôle      : chaîne ML distincte de la chaîne applicative. À chaque modification du banc simulé
#              ou du code d'apprentissage : régénère les données, réentraîne, évalue contre la
#              règle de référence sur DEUX capteurs (nominal et décalé), vérifie que le C embarqué
#              décide exactement comme Python et que le modèle versionné est bien celui que le code
#              produit. Un modèle qui échoue à l'un de ces critères n'est pas promu.
#              v1.1 : prévision du niveau (cycle MLOps, ml/forecast) réentraînée sur 24 h simulées et
#              soumise au critère d'acceptation hors ligne (battre persistance ET tendance à chaque horizon).
# =============================================================================
name: Apprentissage automatique

on:
  push:
    paths:
      - "ml/**"
      - "backend/simulator/tools/fog_bench.py"
      - "backend/gateway/stations.json"
      - "firmware/lib/floodwatch_core/**"
      - "firmware/test/host/**"
      - "backend/simulator/fwsim/**"
      - "backend/simulator/tools/sensor_bench.py"
      - "backend/simulator/requirements.txt"
      - ".github/workflows/ml.yml"
  pull_request:
    paths:
      - "ml/**"
      - "backend/simulator/tools/fog_bench.py"
      - "backend/gateway/stations.json"
      - "firmware/lib/floodwatch_core/**"
      - "firmware/test/host/**"
      - "backend/simulator/fwsim/**"
      - "backend/simulator/tools/sensor_bench.py"
      - "backend/simulator/requirements.txt"
      - ".github/workflows/ml.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensor-anomaly:
    name: Classifieur embarqué du capteur (entraînement, critères, export C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r ml/requirements.txt
      - name: Tests (indicateurs, vote commun Python / C, critères, parité firmware / simulateur)
        run: python -m pytest -q ml/tests
      - name: Réentraînement complet, critères d'acceptation et contrôle de ml/export/
        run: python ml/sensor_anomaly/train.py --check

  level-forecast:
    name: Prévision du niveau (apprentissage sur le banc, critère d'acceptation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r ml/requirements.txt
      - name: Apprentissage sur 24 h simulées, critère d'acceptation et parité de l'évaluateur exporté
        working-directory: ml
        env:
          ML_HOME: ${{ runner.temp }}/ml-home
        run: python -m forecast.pipeline train --source sim --hours 24 --check
