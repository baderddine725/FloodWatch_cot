# =============================================================================
#  Module    : Cloud of Things – FloodWatch (Sup'Com 2026-2027)
#  Couche    : back-end & IoT – intégration continue
#  Fichier   : .github/workflows/backend-iot.yml
#  Équipe    : FloodWatch – Auteur : Ksontini Amine
#  Créé le   : 2026-11-05          Modifié le : 2026-11-05          Version : 1.0
#  Rôle      : tests de la partie Back-end & IoT à chaque push / pull request qui la touche
#              (bonne pratique n° 11 du cours : CI). Cinq tâches indépendantes, en parallèle.
# =============================================================================
name: Back-end & IoT

on:
  push:
    paths:
      - "prediction/**"
      - "simulator/**"
      - "gateway/**"
      - "firmware/**"
      - "deploy/mosquitto/**"
      - "deploy/scripts/**"
      - "deploy/docker-compose.yml"
      - "deploy/.env.example"
      - "docs/wot/**"
      - ".github/workflows/backend-iot.yml"
  pull_request:
    paths:
      - "prediction/**"
      - "simulator/**"
      - "gateway/**"
      - "firmware/**"
      - "deploy/mosquitto/**"
      - "deploy/scripts/**"
      - "deploy/docker-compose.yml"
      - "deploy/.env.example"
      - "docs/wot/**"
      - ".github/workflows/backend-iot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prediction:
    name: Prédiction (JUnit, Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prediction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilation (-Werror) et 38 tests JUnit
        run: sh ./mvnw -B verify

  simulator:
    name: Simulateur et Thing Descriptions (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: simulator/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests (config, MQTT, station, validation des TD, fichiers générés à jour)
        run: python -m pytest -q

  gateway:
    name: Passerelle Node-RED et scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests des fonctions du flux Node-RED
        run: node --test gateway/node-red/test/flows.test.mjs
      - name: Syntaxe des réglages et du flux
        run: |
          node --check gateway/node-red/settings.js
          node -e "JSON.parse(require('fs').readFileSync('gateway/node-red/flows.json', 'utf8'))"
      - name: Syntaxe des scripts shell
        run: |
          for f in deploy/mosquitto/entrypoint.sh gateway/mosquitto/docker-entrypoint.sh deploy/scripts/test-acl.sh firmware/tools/build.sh; do
            sh -n "$f" && echo "ok  $f"
          done
          for f in gateway/install-gateway.sh deploy/scripts/install-vm.sh deploy/scripts/gen-certs.sh; do
            bash -n "$f" && echo "ok  $f"
          done

  firmware:
    name: Firmware ESP32 (PlatformIO)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install "platformio>=6.1,<7"
      - name: Compilation avec la configuration d'exemple (station_config.h n'est pas versionné)
        run: |
          cp include/station_config.example.h include/station_config.h
          pio run

  brokers:
    name: Brokers, ACL et TLS 1.3 (Docker)
    runs-on: ubuntu-latest
    needs: [gateway]
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Secrets aléatoires et certificats (comme install-vm.sh)
        run: |
          cp .env.example .env
          for k in DB_PASSWORD MQTT_API_PASSWORD MQTT_GATEWAY_PASSWORD ADMIN_PASSWORD OPERATOR_PASSWORD \
                   MQTT_OBSERVER_PASSWORD LOCAL_GATEWAY_PASSWORD LOCAL_DIAG_PASSWORD STATION_PASSWORD \
                   NODE_RED_ADMIN_PASSWORD GATEWAY_CLOUD_PASSWORD; do
            sed -i "s|^$k=.*|$k=$(openssl rand -hex 12)|" .env
          done
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|; s|^SERVER_NAME=.*|SERVER_NAME=localhost|" .env
          ./scripts/gen-certs.sh localhost
      - name: Démarrage des brokers, de la passerelle et des stations simulées (sans le middleware)
        run: docker compose --profile iot up -d --build --wait --wait-timeout 180 mosquitto mosquitto-local node-red simulator
      - name: Passerelle en bonne santé (broker local + Cloud connectés)
        run: |
          for _ in $(seq 1 20); do
            out=$(curl -s http://localhost:1880/health || true)
            echo "$out" | grep -q '"status":"UP"' && { echo "$out"; exit 0; }
            sleep 3
          done
          echo "$out"; exit 1
      - name: Comptes, ACL et TLS 1.3 (32 cas)
        run: docker compose --profile test run --rm --build acl-test
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose --profile iot logs --tail 80 mosquitto mosquitto-local node-red simulator
      - name: Arrêt
        if: always()
        run: docker compose --profile iot down -v
