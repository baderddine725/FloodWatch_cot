# ---------------------------------------------------------------------------
# FloodWatch – configuration par défaut (développement local).
# Chaque clé peut être surchargée par une variable d'environnement :
#   mqtt.broker.url -> MQTT_BROKER_URL, jwt.secret -> JWT_SECRET, etc.
# ---------------------------------------------------------------------------
# Broker MQTT Cloud. TLS : ssl://host:8883 (+ truststore si CA privée)
mqtt.broker.url=tcp://localhost:1883
mqtt.client.id=floodwatch-middleware
mqtt.broker.username=
mqtt.broker.password=
mqtt.broker.truststore.path=
mqtt.broker.truststore.password=changeit
# URL publique du broker affichée dans les Thing Descriptions
mqtt.public.url=mqtts://localhost:8883

# Sécurité (à définir impérativement en production : 32 caractères minimum)
jwt.secret=
jwt.ttl.seconds=28800
admin.username=admin
admin.password=admin123!
operator.username=operator
operator.password=operator123!
cors.allowed.origins=*

# Web Push (VAPID). Vides : clés générées au premier démarrage et stockées en base.
vapid.public.key=
vapid.private.key=
vapid.subject=mailto:floodwatch@supcom.tn

# Supervision
station.offline.after.seconds=45
command.ack.timeout.seconds=15
seed.demo.stations=true
