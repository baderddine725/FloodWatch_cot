# =============================================================================
#  FloodWatch – déploiement Cloud (machine virtuelle IaaS)
#  Usage : cp .env.example .env && ./scripts/gen-certs.sh <domaine> && docker compose up -d --build
#  Équipe FloodWatch – v2.1 – 2026-11-23 (profil ml, certificat web Let's Encrypt)
#
#  Quatre noms DNS, un seul serveur d'applications :
#    www.<domaine>    front-office (citoyen)   -> WildFly, hôte virtuel www-host
#    admin.<domaine>  back-office (pilotage)   -> WildFly, hôte virtuel admin-host
#    api.<domaine>    API REST + WebSocket     -> WildFly, hôte virtuel api-host
#    iam.<domaine>    authentification         -> WildFly, api-host (routes /api/auth)
#  Le service « dns » (CoreDNS) résout ce domaine local ; Nginx ne fait plus que
#  terminer le TLS et relayer vers WildFly en conservant l'en-tête Host.
# =============================================================================
name: floodwatch

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-floodwatch}
      POSTGRES_USER: ${DB_USER:-floodwatch}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-floodwatch} -d ${DB_NAME:-floodwatch}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/mosquitto/config/entrypoint.sh"]
    environment:
      MQTT_API_USERNAME: ${MQTT_API_USERNAME:-floodwatch-api}
      MQTT_API_PASSWORD: ${MQTT_API_PASSWORD:?MQTT_API_PASSWORD}
      MQTT_GATEWAY_USERNAME: ${MQTT_GATEWAY_USERNAME:-gateway}
      MQTT_GATEWAY_PASSWORD: ${MQTT_GATEWAY_PASSWORD:?MQTT_GATEWAY_PASSWORD}
      MQTT_OBSERVER_PASSWORD: ${MQTT_OBSERVER_PASSWORD:-}
      # comptes dédiés des passerelles (mot de passe vide = non créé) : id|mot de passe|stations ; ...
      # 1re entrée : passerelle Docker ; GATEWAY_ACCOUNTS_EXTRA : passerelles Raspberry Pi réelles
      GATEWAY_ACCOUNTS: ${GATEWAY_ID:-gw-ariana-01}|${GATEWAY_CLOUD_PASSWORD:-}|${STATION_CODES:-upstream-01 wadi-01 underpass-01};${GATEWAY_ACCOUNTS_EXTRA:-}
    volumes:
      - ./mosquitto:/mosquitto/config:ro
      - ./certs:/mosquitto/certs:ro
      - mqttdata:/mosquitto/data
    ports:
      - "8883:8883"

  api:
    # Middleware Jakarta EE 11 sur WildFly 42. Sert aussi les deux front-ends
    # (hôtes virtuels Undertow) : voir middleware/wildfly/add-host.cli.
    build:
      context: ../../middleware
      args:
        BASE_DOMAIN: ${BASE_DOMAIN:-floodwatch.local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-floodwatch}
      DB_USER: ${DB_USER:-floodwatch}
      DB_PASSWORD: ${DB_PASSWORD}
      MQTT_BROKER_URL: tcp://mosquitto:1883
      MQTT_BROKER_USERNAME: ${MQTT_API_USERNAME:-floodwatch-api}
      MQTT_BROKER_PASSWORD: ${MQTT_API_PASSWORD}
      MQTT_PUBLIC_URL: mqtts://mqtt.${BASE_DOMAIN:-floodwatch.local}:8883
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD}
      OPERATOR_USERNAME: ${OPERATOR_USERNAME:-operator}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?OPERATOR_PASSWORD}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:floodwatch@supcom.tn}
      # Vide : les en-têtes CORS sont posés par Undertow sur chaque hôte virtuel
      # (configure.cli). Ne renseigner que pour un front-end servi hors de WildFly.
      CORS_ALLOWED_ORIGINS: ""
      # Entrée météo de la prévision : none (défaut, persistance) ou open-meteo (stations réelles).
      FORECAST_WEATHER_PROVIDER: ${FORECAST_WEATHER_PROVIDER:-none}
      # Modèles appris déposés par le service « trainer » (profil ml) : champion et challenger.
      ML_MODELS_DIR: /opt/floodwatch/ml/models
    volumes:
      # Dossier de travail du cycle MLOps, en LECTURE SEULE : l'API ne fait que lire le registre.
      - mlhome:/opt/floodwatch/ml:ro
      # Les deux front-ends et leurs ressources communes, servis tels quels par
      # Undertow. Sur une VM, le dossier est synchronisé par scripts/update.sh.
      - ../../frontend/frontoffice:/opt/jboss/wildfly/www/frontoffice:ro
      - ../../frontend/backoffice:/opt/jboss/wildfly/www/backoffice:ro
      - ../../frontend/shared:/opt/jboss/wildfly/www/shared:ro
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-floodwatch.local}
      # certificat présenté aux navigateurs (dans ./certs) : AC privée par défaut, Let's Encrypt
      # sur une VM publique (scripts/deploy-cloud.sh) ; MQTT garde toujours l'AC privée
      WEB_CERT: ${WEB_CERT:-server.crt}
      WEB_KEY: ${WEB_KEY:-server.key}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"

  dns:
    # Domaine local FloodWatch : www, admin, api, iam (et tout autre nom du
    # domaine) pointent sur PUBLIC_IP ; le reste est transmis aux résolveurs
    # publics. Voir backend/deploy/coredns/Corefile et docs/deployment.md.
    image: coredns/coredns:1.12.4
    restart: unless-stopped
    command: ["-conf", "/etc/coredns/Corefile"]
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-floodwatch.local}
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
    volumes:
      - ./coredns:/etc/coredns:ro
    ports:
      - "${DNS_PORT:-53}:53/udp"
      - "${DNS_PORT:-53}:53/tcp"

  # ===========================================================================
  #  Partie Back-end & IoT (Ksontini Amine, 2026-11-03) – activée par profil, ne change
  #  rien au démarrage par défaut :
  #    docker compose --profile iot up -d --build        passerelle + stations simulées
  #    docker compose --profile test run --rm --build acl-test   test des comptes, ACL et TLS
  #    docker compose --profile tools run --rm firmware  compilation du firmware ESP32
  #  Le broker Cloud est le service « mosquitto » ci-dessus (TLS 1.3, port 8883).
  # ===========================================================================
  mosquitto-local:              # broker de la passerelle (Raspberry Pi simulé)
    image: eclipse-mosquitto:2
    profiles: ["iot"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/gateway-config/docker-entrypoint.sh"]
    environment:
      LOCAL_GATEWAY_PASSWORD: ${LOCAL_GATEWAY_PASSWORD:-}
      LOCAL_DIAG_PASSWORD: ${LOCAL_DIAG_PASSWORD:-}
      STATION_PASSWORD: ${STATION_PASSWORD:-}
      STATION_CODES: ${STATION_CODES:-upstream-01 wadi-01 underpass-01}
    volumes:
      - ../gateway/mosquitto:/gateway-config:ro
      - mqttlocaldata:/mosquitto/data
    ports:
      - "${LOCAL_MQTT_PORT:-1883}:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -u diag -P \"$$LOCAL_DIAG_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 5s
      timeout: 5s
      retries: 10

  node-red:                     # passerelle : filtrage, relais local <-> Cloud, file d'attente, sécurité locale
    build:
      context: ../gateway
      dockerfile: node-red/Dockerfile
    profiles: ["iot"]
    restart: unless-stopped
    # Pas de dépendance au broker Cloud : la passerelle doit fonctionner sans lui.
    depends_on:
      mosquitto-local:
        condition: service_healthy
    environment:
      GATEWAY_ID: ${GATEWAY_ID:-gw-ariana-01}
      LOCAL_MQTT_HOST: mosquitto-local
      LOCAL_MQTT_PORT: "1883"
      LOCAL_MQTT_USER: gateway
      LOCAL_MQTT_PASSWORD: ${LOCAL_GATEWAY_PASSWORD:-}
      CLOUD_MQTT_HOST: mosquitto
      CLOUD_MQTT_PORT: "8883"
      CLOUD_MQTT_USER: ${GATEWAY_ID:-gw-ariana-01}      # compte dédié, limité à ses stations
      CLOUD_MQTT_PASSWORD: ${GATEWAY_CLOUD_PASSWORD:-}
      CLOUD_CA_FILE: /certs/ca.crt
      NODE_RED_ADMIN_PASSWORD: ${NODE_RED_ADMIN_PASSWORD:-}
      MUTE_AFTER_SEC: ${MUTE_AFTER_SEC:-60}
      SAFETY_PCT: ${SAFETY_PCT:-85}
      # Prévision de pluie du fog (propagation) : none (défaut) ou open-meteo (stations réelles).
      WEATHER_PROVIDER: ${GATEWAY_WEATHER_PROVIDER:-none}
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro   # certificat PUBLIC de l'AC uniquement
      - noderedata:/data
    ports:
      - "${NODE_RED_PORT:-1880}:1880"

  simulator:                    # stations virtuelles (remplacent les ESP32), branchées sur le broker local
    build: ../simulator
    profiles: ["iot"]
    restart: unless-stopped
    depends_on:
      mosquitto-local:
        condition: service_healthy
    environment:
      SIM_HOST: mosquitto-local
      SIM_PORT: "1883"
      SIM_USERNAME: "{code}"            # chaque station se connecte avec son code (ACL par station)
      SIM_PASSWORD: ${STATION_PASSWORD:-}
      SIM_RAW: "true"                   # télémétrie brute -> filtrage Node-RED
      SIM_STATIONS: ${SIM_STATIONS:-upstream-01,wadi-01,underpass-01}
      SIM_SCENARIO: ${SIM_SCENARIO:-season}
      SIM_FAULTS: ${SIM_FAULTS:-none}     # random : épisodes de défaut du capteur (banc simulé)
      SIM_SPEED: ${SIM_SPEED:-1}             # 1 : temps physique (fog et prévisions en temps réel)
      SIM_OFFLINE_AFTER: ${SIM_OFFLINE_AFTER:-0}
      SIM_TD_BROKER_URL: mqtts://mqtt.${BASE_DOMAIN:-floodwatch.local}:8883
      SIM_STATIONS_FILE: /gateway/stations.json
      SIM_VERBOSE: ${SIM_VERBOSE:-false}
    volumes:
      - ../gateway/stations.json:/gateway/stations.json:ro

  acl-test:                     # test des comptes, ACL et TLS des deux brokers (pile démarrée)
    build:
      context: ./scripts
      dockerfile: acl-test.Dockerfile
    profiles: ["test"]
    environment:
      MQTT_API_PASSWORD: ${MQTT_API_PASSWORD:-}
      MQTT_GATEWAY_PASSWORD: ${MQTT_GATEWAY_PASSWORD:-}
      MQTT_OBSERVER_PASSWORD: ${MQTT_OBSERVER_PASSWORD:-}
      GATEWAY_ID: ${GATEWAY_ID:-gw-ariana-01}
      GATEWAY_CLOUD_PASSWORD: ${GATEWAY_CLOUD_PASSWORD:-}
      LOCAL_GATEWAY_PASSWORD: ${LOCAL_GATEWAY_PASSWORD:-}
      LOCAL_DIAG_PASSWORD: ${LOCAL_DIAG_PASSWORD:-}
      STATION_PASSWORD: ${STATION_PASSWORD:-}
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro

  firmware:                     # compilation du firmware ESP32 (PlatformIO), sans installation locale
    build: ../../firmware
    profiles: ["tools"]
    volumes:
      - ../../firmware:/firmware:ro
      - platformio:/root/.platformio

  # ===========================================================================
  #  Cycle MLOps de la prévision du niveau (Guesmi Baderddine, 2026-11-23) – profil « ml » :
  #    docker compose --profile iot --profile ml up -d --build
  #  trainer : télémétrie de PostgreSQL -> instantané versionné -> apprentissage -> critères ->
  #            challenger (évalué en ombre par l'API) -> promotion -> surveillance -> réapprentissage.
  #  mlflow  : suivi des exécutions et registre des modèles, sur 127.0.0.1 uniquement (pas
  #            d'authentification) ; à distance : ssh -L 5000:localhost:5000 <vm>.
  # ===========================================================================
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    profiles: ["ml"]
    restart: unless-stopped
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000",
              "--backend-store-uri", "sqlite:////mlflow/mlflow.db",
              "--artifacts-destination", "/mlflow/artifacts", "--serve-artifacts",
              "--allowed-hosts", "mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000"]
    volumes:
      - mlflowdata:/mlflow
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"

  trainer:
    build:
      context: ../..
      dockerfile: ml/Dockerfile
    profiles: ["ml"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-floodwatch}
      DB_USER: ${DB_USER:-floodwatch}
      DB_PASSWORD: ${DB_PASSWORD}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ML_CYCLE_MINUTES: ${ML_CYCLE_MINUTES:-30}       # évaluation, promotion et surveillance
      ML_RETRAIN_HOURS: ${ML_RETRAIN_HOURS:-6}        # réapprentissage (plus tôt en cas de dérive)
      ML_TRAIN_DAYS: ${ML_TRAIN_DAYS:-14}             # profondeur d'historique d'un instantané
      ML_MIN_PAIRS: ${ML_MIN_PAIRS:-100}              # paires notées par horizon avant de décider
      ML_RIVER_RETRAIN_DAYS: ${ML_RIVER_RETRAIN_DAYS:-7}  # modèle sur données réelles (Environment Agency) ; 0 : désactivé
    volumes:
      - mlhome:/var/lib/floodwatch-ml

volumes:
  pgdata:
  mqttdata:
  mqttlocaldata:
  noderedata:
  platformio:
  mlhome:
  mlflowdata:
