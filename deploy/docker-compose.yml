# =============================================================================
#  FloodWatch – déploiement Cloud (machine virtuelle IaaS)
#  Usage : cp .env.example .env && ./scripts/gen-certs.sh <domaine> && docker compose up -d --build
#  Équipe FloodWatch – v1.0 – 2026-11-02
# =============================================================================
name: floodwatch

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-floodwatch}
      POSTGRES_USER: ${DB_USER:-floodwatch}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-floodwatch} -d ${DB_NAME:-floodwatch}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/mosquitto/config/entrypoint.sh"]
    environment:
      MQTT_API_USERNAME: ${MQTT_API_USERNAME:-floodwatch-api}
      MQTT_API_PASSWORD: ${MQTT_API_PASSWORD:?MQTT_API_PASSWORD}
      MQTT_GATEWAY_USERNAME: ${MQTT_GATEWAY_USERNAME:-gateway}
      MQTT_GATEWAY_PASSWORD: ${MQTT_GATEWAY_PASSWORD:?MQTT_GATEWAY_PASSWORD}
      MQTT_OBSERVER_PASSWORD: ${MQTT_OBSERVER_PASSWORD:-}
    volumes:
      - ./mosquitto:/mosquitto/config:ro
      - ./certs:/mosquitto/certs:ro
      - mqttdata:/mosquitto/data
    ports:
      - "8883:8883"

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-floodwatch}
      DB_USER: ${DB_USER:-floodwatch}
      DB_PASSWORD: ${DB_PASSWORD}
      MQTT_BROKER_URL: tcp://mosquitto:1883
      MQTT_BROKER_USERNAME: ${MQTT_API_USERNAME:-floodwatch-api}
      MQTT_BROKER_PASSWORD: ${MQTT_API_PASSWORD}
      MQTT_PUBLIC_URL: mqtts://${SERVER_NAME}:8883
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD}
      OPERATOR_USERNAME: ${OPERATOR_USERNAME:-operator}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?OPERATOR_PASSWORD}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:floodwatch@supcom.tn}
      CORS_ALLOWED_ORIGINS: https://${SERVER_NAME}
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot:/var/www/certbot:ro
      - ../pwa:/usr/share/nginx/pwa:ro
    ports:
      - "80:80"
      - "443:443"

  # ===========================================================================
  #  Partie Back-end & IoT (Ksontini Amine, 2026-11-03) – activée par profil, ne change
  #  rien au démarrage par défaut :
  #    docker compose --profile iot up -d --build        passerelle + stations simulées
  #    docker compose --profile test run --rm acl-test   test des comptes, ACL et TLS
  #    docker compose --profile tools run --rm firmware  compilation du firmware ESP32
  #  Le broker Cloud est le service « mosquitto » ci-dessus (TLS 1.3, port 8883).
  # ===========================================================================
  mosquitto-local:              # broker de la passerelle (Raspberry Pi simulé)
    image: eclipse-mosquitto:2
    profiles: ["iot"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/gateway-config/docker-entrypoint.sh"]
    environment:
      LOCAL_GATEWAY_PASSWORD: ${LOCAL_GATEWAY_PASSWORD:-}
      LOCAL_DIAG_PASSWORD: ${LOCAL_DIAG_PASSWORD:-}
      STATION_PASSWORD: ${STATION_PASSWORD:-}
      STATION_CODES: ${STATION_CODES:-underpass-01 wadi-01}
    volumes:
      - ../gateway/mosquitto:/gateway-config:ro
      - mqttlocaldata:/mosquitto/data
    ports:
      - "${LOCAL_MQTT_PORT:-1883}:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -u diag -P \"$$LOCAL_DIAG_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 5s
      timeout: 5s
      retries: 10

  node-red:                     # passerelle : filtrage, relais local <-> Cloud, file d'attente, sécurité locale
    build:
      context: ../gateway
      dockerfile: node-red/Dockerfile
    profiles: ["iot"]
    restart: unless-stopped
    # Pas de dépendance au broker Cloud : la passerelle doit fonctionner sans lui.
    depends_on:
      mosquitto-local:
        condition: service_healthy
    environment:
      GATEWAY_ID: ${GATEWAY_ID:-gw-ariana-01}
      LOCAL_MQTT_HOST: mosquitto-local
      LOCAL_MQTT_PORT: "1883"
      LOCAL_MQTT_USER: gateway
      LOCAL_MQTT_PASSWORD: ${LOCAL_GATEWAY_PASSWORD:-}
      CLOUD_MQTT_HOST: mosquitto
      CLOUD_MQTT_PORT: "8883"
      CLOUD_MQTT_USER: ${MQTT_GATEWAY_USERNAME:-gateway}
      CLOUD_MQTT_PASSWORD: ${MQTT_GATEWAY_PASSWORD:-}
      CLOUD_CA_FILE: /certs/ca.crt
      NODE_RED_ADMIN_PASSWORD: ${NODE_RED_ADMIN_PASSWORD:-}
      MUTE_AFTER_SEC: ${MUTE_AFTER_SEC:-60}
      SAFETY_PCT: ${SAFETY_PCT:-85}
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro   # certificat PUBLIC de l'AC uniquement
      - noderedata:/data
    ports:
      - "${NODE_RED_PORT:-1880}:1880"

  simulator:                    # stations virtuelles (remplacent les ESP32), branchées sur le broker local
    build: ../simulator
    profiles: ["iot"]
    restart: unless-stopped
    depends_on:
      mosquitto-local:
        condition: service_healthy
    environment:
      SIM_HOST: mosquitto-local
      SIM_PORT: "1883"
      SIM_USERNAME: "{code}"            # chaque station se connecte avec son code (ACL par station)
      SIM_PASSWORD: ${STATION_PASSWORD:-}
      SIM_RAW: "true"                   # télémétrie brute -> filtrage Node-RED
      SIM_STATIONS: ${SIM_STATIONS:-underpass-01,wadi-01}
      SIM_SCENARIO: ${SIM_SCENARIO:-storm}
      SIM_SPEED: ${SIM_SPEED:-3}
      SIM_OFFLINE_AFTER: ${SIM_OFFLINE_AFTER:-0}
      SIM_TD_BROKER_URL: mqtts://${SERVER_NAME:-localhost}:8883
      SIM_STATIONS_FILE: /gateway/stations.json
      SIM_VERBOSE: ${SIM_VERBOSE:-false}
    volumes:
      - ../gateway/stations.json:/gateway/stations.json:ro

  acl-test:                     # test des comptes, ACL et TLS des deux brokers (pile démarrée)
    image: eclipse-mosquitto:2
    profiles: ["test"]
    entrypoint: ["/bin/sh", "/scripts/test-acl.sh"]
    environment:
      MQTT_API_PASSWORD: ${MQTT_API_PASSWORD:-}
      MQTT_GATEWAY_PASSWORD: ${MQTT_GATEWAY_PASSWORD:-}
      MQTT_OBSERVER_PASSWORD: ${MQTT_OBSERVER_PASSWORD:-}
      LOCAL_GATEWAY_PASSWORD: ${LOCAL_GATEWAY_PASSWORD:-}
      LOCAL_DIAG_PASSWORD: ${LOCAL_DIAG_PASSWORD:-}
      STATION_PASSWORD: ${STATION_PASSWORD:-}
    volumes:
      - ./scripts:/scripts:ro
      - ./certs/ca.crt:/certs/ca.crt:ro

  firmware:                     # compilation du firmware ESP32 (PlatformIO), sans installation locale
    build: ../firmware
    profiles: ["tools"]
    volumes:
      - ../firmware:/firmware:ro
      - platformio:/root/.platformio

volumes:
  pgdata:
  mqttdata:
  mqttlocaldata:
  noderedata:
  platformio:
