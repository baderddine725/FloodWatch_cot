# =============================================================================
#  Module    : Cloud of Things – FloodWatch (Sup'Com 2026-2027)
#  Couche    : broker Cloud – back-end & IoT
#  Fichier   : deploy/mosquitto/mosquitto.conf
#  Équipe    : FloodWatch – Auteur : Ksontini Amine
#  Créé le   : 2026-11-02          Modifié le : 2026-11-05          Version : 1.2
#  Rôle      : broker MQTT Cloud (Mosquitto 2) : comptes obligatoires, ACL, TLS 1.3 sur 8883.
# =============================================================================
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
allow_anonymous false
password_file /mosquitto/data/passwd
# ACL générée par entrypoint.sh (base du dépôt + une section par passerelle), droits 600
acl_file /mosquitto/data/acl

# Listener interne (réseau Docker uniquement, non publié) : utilisé par l'API
listener 1883

# Listener public MQTT/TLS : passerelles (pont) et stations directement connectées
listener 8883
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
cafile /mosquitto/certs/ca.crt
# TLS 1.3 uniquement (bonne pratique n° 7 du cours) ; 1883 reste interne au réseau Docker
tls_version tlsv1.3
