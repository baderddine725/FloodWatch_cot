# Hôte virtuel « www » : front-office (espace citoyen), servi par WildFly/Undertow.
# Répond aussi sur le domaine nu (floodwatch.local) : c'est la page d'accueil publique.
host.key=www
host.path=/opt/jboss/wildfly/www/frontoffice
host.shared=frontend-shared
host.aliases=www.floodwatch.local,floodwatch.local
host.domains=floodwatch.local
# Meme domaine, points neutralises pour le predicat CORS (voir add-*.cli)
host.domains.regex=floodwatch[.]local
