# Hôte virtuel « api » : application WAR du middleware (REST, WebSocket, Thing Descriptions).
# Le nom iam.<domaine> est un alias du même déploiement, restreint aux routes
# d'authentification par le filtre « iam-scope » (voir add-api.cli).
# « localhost » permet l'accès direct au port 8080 en développement (Postman) sans DNS.
api.name=api
api.version=1.0
api.aliases=api.floodwatch.local,iam.floodwatch.local,localhost
api.iam=iam.floodwatch.local
# Meme nom, points neutralises pour le predicat du filtre iam-scope
api.iam.regex=iam[.]floodwatch[.]local
api.context=floodwatch
api.domains=floodwatch.local
# Meme domaine, points neutralises pour le predicat CORS (voir add-*.cli)
api.domains.regex=floodwatch[.]local
