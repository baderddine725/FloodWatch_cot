openapi: 3.0.3
info:
  title: FloodWatch API
  version: "1.0"
  description: |
    API REST de la plateforme FloodWatch (Jakarta EE 11 / WildFly 42) – Sup'Com, module Cloud of Things 2026-2027.
    Authentification : `POST /auth/login` renvoie un jeton JWT à transmettre dans `Authorization: Bearer <jeton>`.
    Rôles : OPERATOR (supervision, commandes), ADMIN (stations, seuils, comptes). Les routes publiques servent le front-office (espace citoyen).
    Clients d'API : `POST /auth/token` (client credentials) ; jeton à portée et zones, accepté sur `/intelligence/**` et les routes publiques.
    Temps réel : WebSocket `/ws/live` (option `?token=<jwt>` pour recevoir alertes et commandes).
  contact: { name: Équipe FloodWatch, url: "https://github.com/baderddine725/FloodWatch_cot" }
servers:
  - url: https://api.floodwatch.local/api
    description: Hôte virtuel api-host (production, derrière Nginx)
  - url: https://iam.floodwatch.local/api
    description: Hôte virtuel iam-host – routes /auth/** uniquement
  - url: http://localhost:8080/api
    description: WildFly en local (alias « localhost » de api-host)
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    LearnedModel:
      type: object
      nullable: true
      properties:
        modelId: { type: string, example: gbt-202611231700-40a4ed }
        createdAt: { type: string, format: date-time }
        datasetId: { type: string, description: empreinte de l'instantané de données d'apprentissage }
        horizonsSec: { type: array, items: { type: integer } }
        offlineTestMetrics: { type: object, additionalProperties: true, description: erreurs sur le test (modèle, persistance, tendance) par horizon }
    PredictionMetrics:
      type: object
      properties:
        model: { type: string, example: median+linreg-120s }
        horizonSec: { type: integer, example: 180 }
        scored: { type: integer, description: prédictions confrontées à une mesure }
        missed: { type: integer, description: prédictions sans mesure à l'échéance }
        maeCm: { type: number, description: erreur absolue moyenne }
        biasCm: { type: number, description: 'erreur signée moyenne, prévu − réel' }
        rmseCm: { type: number }
        persistenceMaeCm: { type: number, description: erreur de la référence « rien ne change » }
        skill: { type: number, nullable: true, description: 1 − maeCm / persistenceMaeCm }
    Error:
      type: object
      properties: { status: { type: integer }, error: { type: string } }
    Thresholds:
      type: object
      properties:
        criticalCm: { type: number, example: 20 }
        yellowPct: { type: number, example: 30 }
        orangePct: { type: number, example: 60 }
        redPct: { type: number, example: 85 }
        rainThreshold: { type: number, example: 0.2 }
        rapidRiseCmPerMin: { type: number, example: 3 }
        forecastRedMinutes: { type: number, example: 10 }
        reopenDelaySec: { type: integer, example: 60 }
        sensorHeightCm: { type: number, example: 30 }
        periodNormalSec: { type: integer, example: 30 }
        periodWatchSec: { type: integer, example: 5 }
    Station:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: underpass-01 }
        name: { type: string }
        description: { type: string }
        type: { type: string, enum: [UNDERPASS, WADI, LOW_ROAD, FORD, OTHER] }
        latitude: { type: number }
        longitude: { type: number }
        address: { type: string }
        thresholds: { $ref: '#/components/schemas/Thresholds' }
        alertLevel: { type: string, enum: [GREEN, YELLOW, ORANGE, RED] }
        alertReasons: { type: string }
        levelCm: { type: number }
        levelPct: { type: number }
        rain: { type: number, description: intensité normalisée 0..1 }
        zone: { type: string, example: ariana }
        stationMode: { type: string, enum: [NORMAL, LOCAL_SAFETY, DEGRADED], description: mode de décision publié par la station }
        slopeCmPerMin: { type: number }
        minutesToOverflow: { type: number, nullable: true }
        riskIndex: { type: integer }
        online: { type: boolean }
        sensorFault: { type: boolean }
        lastSeenAt: { type: string, format: date-time }
        lastMeasurementAt: { type: string, format: date-time }
        barrier: { type: string, enum: [OPEN, CLOSED, UNKNOWN] }
        light: { type: string, enum: [GREEN, ORANGE, RED, OFF, UNKNOWN] }
        siren: { type: boolean }
        sampling: { type: string, enum: [NORMAL, WATCH] }
        controlMode: { type: string, enum: [AUTO, MANUAL] }
        localSafety: { type: boolean }
        firmware: { type: string }
        rssi: { type: integer }
        roadOpen: { type: boolean }
        etag: { type: string }
    StationRequest:
      type: object
      properties:
        code: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }
        name: { type: string }
        description: { type: string }
        type: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        address: { type: string }
        zone: { type: string }
        thresholds: { $ref: '#/components/schemas/Thresholds' }
    Horizon:
      type: object
      properties:
        minutes: { type: integer, example: 15 }
        levelCm: { type: number }
        levelPct: { type: number }
        overflowRisk: { type: number, minimum: 0, maximum: 1, description: 'P(niveau >= critique) sous erreur gaussienne ; indice ordonné, non calibré sur des crues réelles' }
        sigmaCm: { type: number, description: "écart type de l'erreur de prévision à cet horizon" }
        sigmaBasis: { type: string, pattern: '^(measured|default|extrapolated-from-[0-9]+min)$', example: extrapolated-from-10min, description: 'mesuré (historique 7 j), extrapolé en √h depuis le plus long horizon mesuré, ou prudent par défaut' }
    Forecast:
      type: object
      properties:
        station: { type: string, example: wadi-01 }
        zone: { type: string, example: ariana }
        generatedAt: { type: string, format: date-time }
        method: { type: string, enum: [reservoir-calibrated, median+linreg-120s], description: 'modèle réservoir calibré par la passerelle, ou régression linéaire de repli' }
        modelVersion: { type: string }
        levelCm: { type: number, nullable: true }
        criticalCm: { type: number }
        risk: { type: string }
        horizons: { type: array, items: { $ref: '#/components/schemas/Horizon' } }
        assumptions: { type: object, additionalProperties: true, description: 'hypothèses de la prévision (pluie constante, apport amont, nature du risque)' }
        calibration: { type: object, nullable: true, description: 'a, b, g, r2, samples, calibratedAt, used' }
    ApiClient:
      type: object
      properties:
        clientId: { type: string, example: ariana-mobility }
        displayName: { type: string }
        scopes: { type: array, items: { type: string, enum: ['forecast:read'] } }
        zones: { type: array, items: { type: string }, description: 'zones autorisées ; "*" = toutes' }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
    OAuthError:
      type: object
      properties:
        error: { type: string, enum: [invalid_request, invalid_client, unsupported_grant_type, invalid_scope] }
    Measurement:
      type: object
      properties:
        ts: { type: string, format: date-time }
        levelCm: { type: number }
        levelPct: { type: number }
        rain: { type: number }
        alertLevel: { type: string }
    Alert:
      type: object
      properties:
        id: { type: string, format: uuid }
        stationId: { type: string, format: uuid }
        stationCode: { type: string }
        stationName: { type: string }
        type: { type: string, enum: [LEVEL, OFFLINE, SENSOR_FAULT, LOCAL_SAFETY, PROPAGATION] }
        level: { type: string, enum: [GREEN, YELLOW, ORANGE, RED] }
        message: { type: string }
        raisedAt: { type: string, format: date-time }
        active: { type: boolean }
        resolvedAt: { type: string, format: date-time }
        acknowledgedAt: { type: string, format: date-time }
        acknowledgedBy: { type: string }
        barrierClosedAt: { type: string, format: date-time }
        barrierReopenedAt: { type: string, format: date-time }
    Command:
      type: object
      properties:
        id: { type: string, format: uuid }
        stationCode: { type: string }
        actuator: { type: string, enum: [barrier, light, siren, sampling] }
        value: { type: string }
        origin: { type: string, enum: [AUTO, MANUAL] }
        issuedBy: { type: string }
        issuedAt: { type: string, format: date-time }
        status: { type: string, enum: [PENDING, ACKED, FAILED] }
        ackedAt: { type: string, format: date-time }
        detail: { type: string }
    CommandRequest:
      type: object
      required: [actuator, value]
      properties:
        actuator: { type: string, enum: [barrier, light, siren, sampling] }
        value: { type: string, description: "barrier: OPEN|CLOSE ; light: GREEN|ORANGE|RED|OFF ; siren: ON|OFF ; sampling: NORMAL|WATCH" }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        fullName: { type: string }
        roles: { type: array, items: { type: string, enum: [CITIZEN, OPERATOR, ADMIN] } }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
  parameters:
    StationId:
      name: id
      in: path
      required: true
      description: UUID ou code de la station
      schema: { type: string, example: underpass-01 }
  responses:
    Unauthorized: { description: Jeton absent ou invalide, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Rôle insuffisant, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Ressource introuvable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
paths:
  /health:
    get:
      tags: [Supervision]
      summary: État du service (base de données, broker MQTT)
      responses: { '200': { description: OK }, '503': { description: Base indisponible } }
  /auth/login:
    post:
      tags: [Authentification]
      summary: Obtenir un jeton JWT
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { username: { type: string }, password: { type: string } } } } }
      responses:
        '200': { description: Jeton, content: { application/json: { schema: { type: object, properties: { token: { type: string }, tokenType: { type: string }, expiresIn: { type: integer }, user: { $ref: '#/components/schemas/User' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/token:
    post:
      tags: [Authentification]
      summary: "Jeton de client d'API (OAuth 2.0 client credentials, RFC 6749 § 4.4)"
      description: |
        Servi par iam.<domaine>. Identifiants en HTTP Basic (`client_id:client_secret`) ou dans le formulaire.
        Le jeton porte `scope` et `zones`, aucun rôle : il est accepté sur les routes `/intelligence/**`
        (portée `forecast:read`) et sur les routes publiques, et refusé (403) sur toute route à rôle.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [client_credentials] }
                scope: { type: string, description: 'portées demandées, séparées par des espaces (défaut : toutes celles accordées)' }
                client_id: { type: string }
                client_secret: { type: string }
      responses:
        '200': { description: Jeton, content: { application/json: { schema: { type: object, properties: { access_token: { type: string }, token_type: { type: string, example: Bearer }, expires_in: { type: integer }, scope: { type: string, example: 'forecast:read' } } } } } }
        '400': { description: Requête ou portée invalide, content: { application/json: { schema: { $ref: '#/components/schemas/OAuthError' } } } }
        '401': { description: 'Client inconnu, désactivé ou mauvais secret', content: { application/json: { schema: { $ref: '#/components/schemas/OAuthError' } } } }
  /auth/me:
    get:
      tags: [Authentification]
      security: [{ bearer: [] }]
      summary: Profil de l'utilisateur connecté
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /stations:
    get:
      tags: [Stations]
      summary: Liste des stations et de leur état temps réel (public)
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Station' } } } } } }
    post:
      tags: [Stations]
      security: [{ bearer: [] }]
      summary: Créer une station (ADMIN) ; publie sa configuration retenue
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StationRequest' } } } }
      responses: { '201': { description: Créée }, '400': { description: Requête invalide }, '403': { $ref: '#/components/responses/Forbidden' } }
  /stations/{id}:
    parameters: [{ $ref: '#/components/parameters/StationId' }]
    get:
      tags: [Stations]
      summary: Détail d'une station (ETag, If-None-Match)
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Station' } } } }, '304': { description: Non modifiée }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      tags: [Stations]
      security: [{ bearer: [] }]
      summary: Modifier métadonnées et seuils (ADMIN, If-Match optionnel)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StationRequest' } } } }
      responses: { '200': { description: OK }, '412': { description: ETag obsolète }, '403': { $ref: '#/components/responses/Forbidden' } }
    delete:
      tags: [Stations]
      security: [{ bearer: [] }]
      summary: Supprimer une station et son historique (ADMIN)
      responses: { '204': { description: Supprimée }, '403': { $ref: '#/components/responses/Forbidden' } }
  /stations/{id}/measurements:
    parameters: [{ $ref: '#/components/parameters/StationId' }]
    get:
      tags: [Stations]
      summary: Historique des mesures
      parameters:
        - { name: minutes, in: query, schema: { type: integer, default: 60 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, default: 2000, maximum: 10000 } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Measurement' } } } } } }
  /stations/{id}/prediction:
    parameters: [{ $ref: '#/components/parameters/StationId' }]
    get:
      tags: [Stations]
      summary: Temps estimé avant débordement, vitesse de montée, indice de risque
      responses: { '200': { description: OK } }
  /stations/{id}/td:
    parameters: [{ $ref: '#/components/parameters/StationId' }]
    get:
      tags: [Stations]
      summary: Thing Description W3C WoT 1.1
      responses: { '200': { description: OK, content: { application/td+json: { schema: { type: object } } } } }
  /stations/{id}/commands:
    parameters: [{ $ref: '#/components/parameters/StationId' }]
    get:
      tags: [Commandes]
      security: [{ bearer: [] }]
      summary: Dernières commandes (OPERATOR)
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Command' } } } } } }
    post:
      tags: [Commandes]
      security: [{ bearer: [] }]
      summary: Commande manuelle d'un actionneur (OPERATOR) – la station passe en mode MANUAL
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CommandRequest' } } } }
      responses: { '202': { description: Commande publiée, content: { application/json: { schema: { $ref: '#/components/schemas/Command' } } } }, '400': { description: Actionneur ou valeur invalide } }
  /stations/{id}/mode:
    parameters: [{ $ref: '#/components/parameters/StationId' }]
    put:
      tags: [Commandes]
      security: [{ bearer: [] }]
      summary: Mode de pilotage AUTO / MANUAL (OPERATOR)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { mode: { type: string, enum: [AUTO, MANUAL] } } } } } }
      responses: { '200': { description: OK } }
  /stations/{id}/config/publish:
    parameters: [{ $ref: '#/components/parameters/StationId' }]
    post:
      tags: [Stations]
      security: [{ bearer: [] }]
      summary: Republier la configuration retenue vers la station (ADMIN)
      responses: { '200': { description: OK } }
  /alerts:
    get:
      tags: [Alertes]
      security: [{ bearer: [] }]
      summary: Alertes (OPERATOR)
      parameters:
        - { name: active, in: query, schema: { type: boolean } }
        - { name: station, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Alert' } } } } } }
  /alerts/{id}/ack:
    post:
      tags: [Alertes]
      security: [{ bearer: [] }]
      summary: Acquitter une alerte (OPERATOR)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Alert' } } } } }
  /kpi:
    get:
      tags: [KPI]
      security: [{ bearer: [] }]
      summary: Indicateurs de performance (OPERATOR)
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 7 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses: { '200': { description: OK } }
  /kpi/models:
    get:
      tags: [KPI]
      security: [{ bearer: [] }]
      summary: Cycle MLOps du modèle de prévision appris (OPERATOR)
      description: >
        Champion (sert les prévisions s'il bat, en service, la méthode en place) et challenger (évalué
        en ombre sur les mesures réelles), journal des promotions et dernière surveillance (dérive des
        indicateurs, erreurs en service), tels que publiés par le service d'apprentissage. `null` :
        aucun modèle de ce rôle.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  champion: { $ref: '#/components/schemas/LearnedModel' }
                  challenger: { $ref: '#/components/schemas/LearnedModel' }
                  registryUpdatedAt: { type: string, format: date-time, nullable: true }
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        at: { type: string, format: date-time }
                        event: { type: string, enum: [challenger, promoted, demoted, rejected-offline, rejected-live] }
                        model: { type: string }
                      additionalProperties: true
                  monitoring:
                    type: object
                    nullable: true
                    properties:
                      at: { type: string, format: date-time }
                      model: { type: string, nullable: true }
                      psi: { type: object, additionalProperties: { type: number } }
                      drift: { type: boolean }
                      live: { type: array, items: { type: object, additionalProperties: true } }
        '401': { description: Non authentifié }
        '403': { description: Rôle insuffisant }
  /kpi/predictions:
    get:
      tags: [KPI]
      security: [{ bearer: [] }]
      summary: Qualité des modèles de prédiction, par horizon (OPERATOR)
      description: >
        Erreur mesurée sur des prédictions réellement émises puis confrontées au niveau observé à
        l'échéance. `biasCm` est signé (prévu − réel) ; `skill` compare le modèle à la référence
        « le niveau ne change pas » (≤ 0 : le modèle n'apporte rien à cet horizon).
      parameters:
        - { name: hours, in: query, schema: { type: integer, default: 24, minimum: 1, maximum: 2160 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
                  horizons:
                    type: array
                    items: { $ref: '#/components/schemas/PredictionMetrics' }
  /kpi/sensors/{code}:
    get:
      tags: [KPI]
      security: [{ bearer: [] }]
      summary: Santé du capteur de niveau d'une station (OPERATOR)
      description: >
        Répartition des lectures retenues (`ACCEPTED`), écartées comme échos parasites (`OUTLIER`)
        et en défaut (`FAULT`), avec la qualité moyenne des échos pour chaque verdict.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: hours, in: query, schema: { type: integer, default: 24, minimum: 1, maximum: 2160 } }
      responses: { '200': { description: OK }, '404': { description: Station inconnue } }
  /clients:
    get:
      tags: ["Clients d'API"]
      security: [{ bearer: [] }]
      summary: "Liste des clients d'API, sans secret (ADMIN)"
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ApiClient' } } } } } }
    post:
      tags: ["Clients d'API"]
      security: [{ bearer: [] }]
      summary: "Créer un client d'API (ADMIN) – le secret n'est montré qu'une fois"
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, scopes, zones], properties: { name: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }, displayName: { type: string }, scopes: { type: array, items: { type: string } }, zones: { type: array, items: { type: string } } } } } } }
      responses: { '201': { description: 'Créé, avec clientSecret' }, '400': { description: Portée inconnue ou champ manquant }, '409': { description: Identifiant déjà utilisé } }
  /clients/{name}/enabled:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    put: { tags: ["Clients d'API"], security: [{ bearer: [] }], summary: 'Activer ou désactiver un client (ADMIN)', requestBody: { content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean } } } } } }, responses: { '200': { description: OK } } }
  /clients/{name}:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    delete: { tags: ["Clients d'API"], security: [{ bearer: [] }], summary: 'Supprimer un client (ADMIN)', responses: { '204': { description: Supprimé } } }
  /intelligence/stations:
    get:
      tags: [Intelligence]
      security: [{ bearer: [] }]
      summary: Stations visibles du client (zones du jeton) et état de leur calibration
      description: 'Portée `forecast:read`. Un jeton utilisateur (opérateur, administrateur) voit toutes les zones.'
      responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { description: Portée manquante } }
  /intelligence/stations/{code}/forecast:
    get:
      tags: [Intelligence]
      security: [{ bearer: [] }]
      summary: Prévision multi-horizon du niveau et risque de débordement
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, example: wadi-01 } }
        - { name: horizons, in: query, description: 'minutes, séparées par des virgules (1 à 120)', schema: { type: string, default: '5,10,15,30' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Forecast' } } } }
        '400': { description: Horizons invalides }
        '404': { description: Station inconnue ou hors des zones du client }
  /intelligence/zones/{zone}/risk:
    get:
      tags: [Intelligence]
      security: [{ bearer: [] }]
      summary: Risque de la zone à 30 min par station et pré-alertes de propagation en cours
