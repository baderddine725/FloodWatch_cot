# ---------------------------------------------------------------------------
# FloodWatch – configuration par défaut (développement local).
# Chaque clé peut être surchargée par une variable d'environnement :
#   mqtt.broker.url -> MQTT_BROKER_URL, jwt.secret -> JWT_SECRET, etc.
# ---------------------------------------------------------------------------
# Broker MQTT Cloud. TLS : ssl://host:8883 (+ truststore si CA privée)
mqtt.broker.url=tcp://localhost:1883
mqtt.client.id=floodwatch-middleware
mqtt.broker.username=
mqtt.broker.password=
mqtt.broker.truststore.path=
mqtt.broker.truststore.password=changeit
# URL publique du broker affichée dans les Thing Descriptions
mqtt.public.url=mqtts://localhost:8883

# Sécurité (à définir impérativement en production : 32 caractères minimum)
jwt.secret=
jwt.ttl.seconds=28800
admin.username=admin
admin.password=admin123!
operator.username=operator
operator.password=operator123!
# CORS : en production, les en-têtes sont posés par Undertow sur chaque hôte virtuel
# (middleware/wildfly/configure.cli). Laisser vide pour éviter des en-têtes en double ;
# renseigner des origines (séparées par une virgule) uniquement pour un front-end servi
# hors de WildFly pendant le développement.
cors.allowed.origins=

# Web Push (VAPID). Vides : clés générées au premier démarrage et stockées en base.
vapid.public.key=
vapid.private.key=
vapid.subject=mailto:floodwatch@supcom.tn

# Supervision
station.offline.after.seconds=45
command.ack.timeout.seconds=15
seed.demo.stations=true

# Historique des prédictions (boucle de mesure des modèles, voir docs/ml-architecture.md).
# Horizons en secondes ; une série est enregistrée par station au plus toutes les
# « interval » secondes, puis comparée à la mesure la plus proche de l'échéance (± tolerance).
prediction.history.enabled=true
prediction.history.horizons.seconds=60,180,300,600
prediction.history.interval.seconds=30
prediction.history.tolerance.seconds=20
prediction.history.missed.after.seconds=120

# Service de prévision (GET /api/intelligence/...). La calibration de la passerelle n'est utilisée que
# si elle explique assez les mesures (R²) et qu'elle est récente ; sinon : régression linéaire.
forecast.calibration.min.r2=0.5
forecast.calibration.max.age.hours=24
# Entrée météo de la prévision : none (persistance de la pluie mesurée) ou open-meteo (API publique,
# pas de 15 min). Désactivée par défaut : avec le simulateur, la pluie réelle n'est pas la pluie simulée.
forecast.weather.provider=none
forecast.weather.url=https://api.open-meteo.com/v1/forecast
# Intensité de pluie (mm/h) qui vaut 1 sur l'échelle normalisée du pluviomètre de la station.
forecast.rain.full.mmh=20
# Modèles appris (cycle MLOps, ml/forecast) : dossier publié par le service d'apprentissage
# (registry.json + un fichier par modèle), relu dès qu'il change. Absent : aucun modèle appris.
ml.models.enabled=true
ml.models.dir=/opt/floodwatch/ml/models
# Pré-alerte de propagation levée d'office au-delà de ce délai (passerelle redémarrée sans « fin »)
propagation.alert.ttl.minutes=45

