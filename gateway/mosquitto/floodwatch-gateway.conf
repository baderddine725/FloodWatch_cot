# =============================================================================
#  FloodWatch – Broker MQTT local de la passerelle (Raspberry Pi)
#  À copier dans /etc/mosquitto/conf.d/floodwatch-gateway.conf
#  Équipe FloodWatch – Ksontini Amine – v1.0 – 2026-11-02
# =============================================================================
per_listener_settings true
persistence true
persistence_location /var/lib/mosquitto/

# --- Listener LAN (réseau Wi-Fi WPA2 des stations) : authentification obligatoire
listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/floodwatch.passwd
acl_file /etc/mosquitto/floodwatch.acl

# --- Listener local réservé à Node-RED (non exposé hors de la passerelle)
listener 1884 127.0.0.1
allow_anonymous true

# --- Pont MQTT/TLS vers le broker Cloud (port 8883)
connection floodwatch-cloud
address CLOUD_HOST:8883
bridge_protocol_version mqttv311
bridge_cafile /etc/mosquitto/certs/floodwatch-ca.crt
bridge_insecure false
remote_clientid GATEWAY_ID
remote_username gateway
remote_password GATEWAY_PASSWORD
# Session persistante + QoS 1 : les messages sont mis en file pendant une coupure Internet
cleansession false
start_type automatic
restart_timeout 5 60
keepalive_interval 30
notifications true
notification_topic floodwatch/gateways/GATEWAY_ID/bridge
try_private true

# Montant (passerelle -> Cloud). La télémétrie validée est produite par Node-RED.
topic floodwatch/stations/+/telemetry out 1
topic floodwatch/stations/+/heartbeat out 1
topic floodwatch/stations/+/state out 1
topic floodwatch/stations/+/status out 1
topic floodwatch/stations/+/ack out 1
topic floodwatch/gateways/# out 1
# Descendant (Cloud -> stations) : commandes et configuration retenue
topic floodwatch/stations/+/cmd in 1
topic floodwatch/stations/+/config in 1
