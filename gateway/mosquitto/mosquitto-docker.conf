# =============================================================================
#  Module    : Cloud of Things – FloodWatch (Sup'Com 2026-2027)
#  Couche    : passerelle – back-end & IoT
#  Fichier   : gateway/mosquitto/mosquitto-docker.conf
#  Équipe    : FloodWatch – Auteur : Ksontini Amine
#  Créé le   : 2026-11-03          Modifié le : 2026-11-03          Version : 1.0
#  Rôle      : broker LOCAL de la passerelle dans Docker (service mosquitto-local).
#              Réseau local des stations : pas de TLS (Wi-Fi WPA2 en vrai), mais comptes
#              obligatoires et ACL par station. Le relais vers le Cloud est fait par Node-RED.
#              Fichiers de mots de passe et ACL préparés par docker-entrypoint.sh.
# =============================================================================
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%dT%H:%M:%S

allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl

listener 1883
