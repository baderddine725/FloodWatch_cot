; =============================================================================
;  FloodWatch – firmware de la station (ESP32 DevKit) – PlatformIO
;  Compilation : pio run      Téléversement : pio run -t upload    Moniteur : pio device monitor
; =============================================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
    madhephaestus/ESP32Servo@^3.0.6
build_flags =
    -DCORE_DEBUG_LEVEL=1
